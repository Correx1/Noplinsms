<!-- Page Header -->
<div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="flex items-center gap-3">
        <button onclick="window.loadSyllabusPage()" class="p-2 text-gray-500 rounded-lg hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white transition-colors">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div>
            <h1 id="page-title" class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Add Syllabus</h1>
            <p id="page-subtitle" class="text-sm text-gray-600 dark:text-gray-400">Create a new syllabus entry.</p>
        </div>
    </div>
</div>

<!-- Main Form Card -->
<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md border dark:border-gray-700 p-6">
    <form id="syllabus-form">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- Title -->
            <div class="col-span-1 md:col-span-2">
                <label for="syllabus-title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Syllabus Title <span class="text-red-500">*</span></label>
                <input type="text" id="syllabus-title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" placeholder="e.g. JSS1 Mathematics Curriculum" required>
            </div>

            <!-- Subject -->
            <div>
                <label for="syllabus-subject" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Subject <span class="text-red-500">*</span></label>
                <select id="syllabus-subject" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" required>
                    <option value="">Select Subject</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="English Language">English Language</option>
                    <option value="Basic Science">Basic Science</option>
                    <option value="Biology">Biology</option>
                    <option value="Chemistry">Chemistry</option>
                </select>
            </div>

            <!-- Class -->
            <div>
                <label for="syllabus-class" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Class <span class="text-red-500">*</span></label>
                <select id="syllabus-class" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" required>
                    <option value="">Select Class</option>
                    <option value="JSS1">JSS1</option>
                    <option value="JSS2">JSS2</option>
                    <option value="JSS3">JSS3</option>
                    <option value="SSS1">SSS1</option>
                    <option value="SSS2">SSS2</option>
                    <option value="SSS3">SSS3</option>
                </select>
            </div>

            <!-- Department (For SSS Only) -->
            <div id="syllabus-department-container" class="hidden">
                <label for="syllabus-department" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Department (For SSS)</label>
                <select id="syllabus-department" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors">
                    <option value="General" selected>General</option>
                    <option value="Science">Science</option>
                    <option value="Art">Art</option>
                    <option value="Commercial">Commercial</option>
                </select>
            </div>

            <!-- Description -->
            <div class="col-span-1 md:col-span-2">
                <label for="syllabus-desc" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description</label>
                <textarea id="syllabus-desc" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" placeholder="Brief outline of the syllabus"></textarea>
            </div>

            <!-- Start Date -->
            <div>
                <label for="syllabus-start-date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Start Date <span class="text-red-500">*</span></label>
                <input type="date" id="syllabus-start-date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 transition-colors" required>
            </div>

            <!-- End Date -->
            <div>
                <label for="syllabus-end-date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">End Date <span class="text-red-500">*</span></label>
                <input type="date" id="syllabus-end-date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 transition-colors" required>
            </div>
            
            <!-- File Upload -->
            <div class="col-span-1 md:col-span-2">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="syllabus-file">Upload Document <span class="text-gray-500 dark:text-gray-400 text-xs font-normal ml-2">(PDF, DOC, DOCX)</span></label>
                <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400" id="syllabus-file" type="file" accept=".pdf,.doc,.docx">
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-300" id="file_help">Max file size: 5MB.</p>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-4 mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
            <button type="button" onclick="window.loadSyllabusPage()" class="text-gray-700 bg-white border border-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 hover:bg-gray-50 focus:ring-4 focus:outline-none focus:ring-gray-200 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-500 dark:focus:ring-gray-700 transition-colors">
                Cancel
            </button>
            <button type="submit" class="text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 transition-colors">
                Save Syllabus
            </button>
        </div>
    </form>
</div>

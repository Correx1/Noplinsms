<!-- Create Examination — Simple Setup Form -->
<div class="p-4 sm:p-6 bg-white border-b border-gray-200 dark:bg-gray-800 dark:border-gray-700">
    <nav class="flex mb-3" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
            <li><a href="#" onclick="loadDashboardHome()" class="text-gray-700 hover:text-primary-600 dark:text-gray-300"><i class="fas fa-home mr-1"></i>Dashboard</a></li>
            <li><span class="mx-2 text-gray-400">/</span><a href="#" onclick="loadExaminationsPage()" class="text-gray-700 hover:text-primary-600 dark:text-gray-300">Examinations</a></li>
            <li><span class="mx-2 text-gray-400">/</span><span class="text-gray-500">Create Examination</span></li>
        </ol>
    </nav>
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Create New Examination</h1>
    <p class="text-sm text-gray-500 mt-0.5">Set up the exam details. To add questions, use the specific module (Online Exam / CBT / Physical Exam).</p>
</div>

<div class="p-4 sm:p-6 max-w-2xl">
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm p-6">
        <form id="create-exam-form" onsubmit="event.preventDefault(); window._saveExam();" class="space-y-4">

            <div>
                <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Examination Name <span class="text-red-500">*</span></label>
                <input type="text" id="exam-name" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5 focus:ring-primary-500 focus:border-primary-500" placeholder="e.g. First Term Examination 2025/2026" required>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Exam Mode <span class="text-red-500">*</span></label>
                    <select id="exam-type" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5 focus:ring-primary-500 focus:border-primary-500">
                        <option value="Physical">Physical (Paper-based)</option>
                        <option value="Online">Online</option>
                        <option value="CBT">CBT (Computer-Based)</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Category</label>
                    <select id="exam-category" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5 focus:ring-primary-500 focus:border-primary-500">
                        <option>Terminal Examination</option>
                        <option>Mid-Term Assessment</option>
                        <option>Continuous Assessment (CA)</option>
                        <option>Mock / External</option>
                        <option>Entrance Examination</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Academic Session / Term</label>
                <input type="text" id="exam-session" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5" placeholder="e.g. 2024/2025 First Term">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Start Date <span class="text-red-500">*</span></label>
                    <input type="date" id="exam-start-date" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5">
                </div>
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">End Date <span class="text-red-500">*</span></label>
                    <input type="date" id="exam-end-date" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5">
                </div>
            </div>

            <div>
                <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Assigned Classes <span class="text-red-500">*</span></label>
                <div class="flex flex-wrap gap-2 p-3 border border-gray-200 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700/50">
                    <!-- quick select -->
                    <div class="w-full flex flex-wrap justify-between items-center mb-1 border-b dark:border-gray-600 pb-2 gap-2">
                        <span class="text-xs text-gray-500 dark:text-gray-400">Select all that apply</span>
                        <div class="flex gap-3">
                            <button type="button" onclick="document.querySelectorAll('input[name=classes]').forEach(c=>c.checked=true)" class="text-xs text-primary-600 dark:text-primary-400 hover:underline font-medium">All</button>
                            <button type="button" onclick="document.querySelectorAll('input[name=classes]').forEach(c=>c.checked=false)" class="text-xs text-red-500 dark:text-red-400 hover:underline font-medium">Clear</button>
                        </div>
                    </div>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="JSS1A" class="rounded"> JSS1A</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="JSS1B" class="rounded"> JSS1B</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="JSS2A" class="rounded"> JSS2A</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="JSS2B" class="rounded"> JSS2B</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="JSS3A" class="rounded"> JSS3A</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="JSS3B" class="rounded"> JSS3B</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="SSS1A" class="rounded"> SSS1A</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="SSS1B" class="rounded"> SSS1B</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="SSS2A" class="rounded"> SSS2A</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="SSS2B" class="rounded"> SSS2B</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="SSS3A" class="rounded"> SSS3A</label>
                    <label class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-white dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 select-none"><input type="checkbox" name="classes" value="SSS3B" class="rounded"> SSS3B</label>
                </div>
            </div>

            <div>
                <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Notes / Instructions</label>
                <textarea id="exam-description" rows="2" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5" placeholder="Optional notes for staff or students…"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="flex-1 py-2.5 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors">
                    <i class="fas fa-check mr-2"></i>Create Examination
                </button>
                <button type="button" onclick="loadExaminationsPage()" class="px-5 py-2.5 text-sm text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>

<script>
window._saveExam = function() {
    const name = document.getElementById('exam-name').value.trim();
    if (!name) { alert('Exam name required.'); return; }
    const classes = Array.from(document.querySelectorAll('input[name="classes"]:checked')).map(c => c.value);
    if (!classes.length) { alert('Select at least one class.'); return; }
    const exam = {
        id: 'EXM' + Date.now(),
        name,
        type: document.getElementById('exam-type').value,
        category: document.getElementById('exam-category').value,
        session: document.getElementById('exam-session').value,
        startDate: document.getElementById('exam-start-date').value,
        endDate: document.getElementById('exam-end-date').value,
        classes,
        description: document.getElementById('exam-description').value,
        status: 'Upcoming',
        questions: {}
    };
    const arr = JSON.parse(localStorage.getItem('sms_exams') || '[]');
    arr.push(exam);
    localStorage.setItem('sms_exams', JSON.stringify(arr));
    alert('Examination created successfully!');
    loadExaminationsPage();
};
</script>

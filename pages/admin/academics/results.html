<!-- Master Results Matrix Broadsheet -->
<div class="p-4 sm:p-6 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 sm:gap-0 border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
    <div class="w-full mb-1">
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Master Results Matrix</h1>
        <p class="text-sm text-gray-500 mt-1 dark:text-gray-400">Comprehensive view of all students and their subject performance.</p>
    </div>
</div>

<div class="p-4 sm:p-6">
    <!-- Filters -->
    <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
        <form class="grid grid-cols-1 md:grid-cols-4 gap-4" onsubmit="event.preventDefault(); window.loadMasterResults();">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Class</label>
                <select id="mr-class" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required>
                    <!-- JS populated -->
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Term</label>
                <select id="mr-term" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    <option value="1st Term">1st Term</option>
                    <option value="2nd Term" selected>2nd Term</option>
                    <option value="3rd Term">3rd Term</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Academic Session</label>
                <select id="mr-session" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                    <option value="2024/2025">2024/2025</option>
                    <option value="2025/2026">2025/2026</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors dark:bg-primary-600 dark:hover:bg-primary-700 shadow-sm flex justify-center items-center">
                    <i class="fas fa-table mr-2"></i> Load Matrix
                </button>
            </div>
        </form>
    </div>

    <!-- Results Matrix UI -->
    <div id="mr-matrix-container" class="hidden">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-700/50">
                <h2 class="text-lg font-bold text-gray-900 dark:text-white" id="mr-title">Matrix Table</h2>
                <button type="button" onclick="alert('Export to Excel initiated.')" class="bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg text-sm px-4 py-2 transition-colors flex items-center shadow-sm">
                    <i class="fas fa-file-excel mr-2"></i> Export Excel
                </button>
            </div>
            <div class="overflow-x-auto relative shadow-inner">
                <table class="w-full text-sm text-center text-gray-500 dark:text-gray-400 whitespace-nowrap">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-200 dark:bg-gray-700 dark:text-gray-300 sticky top-0 z-10" id="mr-thead">
                        <!-- JS Generated dynamic columns -->
                    </thead>
                    <tbody id="mr-tbody">
                        <!-- JS Generated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Multi Score Sheet -->
<div class="p-4 sm:p-6 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 sm:gap-0 border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
    <div class="w-full mb-1">
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Multi Score Sheet</h1>
    </div>
</div>

<!-- Filters -->
<div class="p-2 sm:p-4">
    <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow mb-6">
        <p class="text-sm text-gray-500 mb-4">Select a class to automatically load its specific grading structure and enter all component marks at once.</p>
        <form class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4" onsubmit="event.preventDefault(); window.loadMultiSheet();">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Class</label>
                <select id="ms-class" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                     <!-- JS Populated -->
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Section</label>
                <select id="ms-section" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    <option value="ALL">All Sections</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Subject</label>
                <select id="ms-subject" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                     <!-- JS Populated -->
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Session</label>
                <select id="ms-session" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    <option value="2024/2025">2024/2025</option>
                    <option value="2023/2024">2023/2024</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Term</label>
                <select id="ms-term" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    <option value="First Term">First Term</option>
                    <option value="Second Term">Second Term</option>
                    <option value="Third Term">Third Term</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 shadow-sm flex items-center justify-center">
                    <i class="fas fa-magic mr-2"></i> Generate Sheet
                </button>
            </div>
        </form>
    </div>

    <!-- Data Table Grid -->
    <div id="ms-table-container" class="hidden w-full bg-white dark:bg-gray-800 p-0 rounded-lg shadow overflow-hidden relative">
        <!-- Header Ribbon -->
        <div class="bg-primary-50 dark:bg-gray-800 p-4 border-b border-primary-100 dark:border-primary-800 flex justify-between items-center flex-wrap gap-2">
            <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white" id="ms-title-display">Mathematics - JSS 1</h3>
                <p class="text-xs text-primary-600 dark:text-primary-400 font-semibold uppercase tracking-wide" id="ms-struct-display">Using Structure: Junior Secondary Grading</p>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <button type="button" onclick="window.downloadBlankSheet()" class="bg-white border text-gray-700 hover:bg-gray-50 border-gray-300 font-semibold py-2 px-4 rounded-lg shadow-sm text-sm transition-colors flex items-center dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:hover:bg-gray-600">
                    <i class="fas fa-print mr-2"></i> Print Template
                </button>
                <button type="button" onclick="window.openOcrModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm transition-colors flex items-center">
                    <i class="fas fa-camera mr-2"></i> Scan & Upload
                </button>
                <button type="button" onclick="window.saveAllMultiMarks()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm transition-colors flex items-center">
                    <i class="fas fa-save mr-2"></i> Save All Marks
                </button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <form id="ms-marks-form" onsubmit="event.preventDefault()">
                <table class="w-full text-[11px] sm:text-sm text-left text-gray-900 dark:text-gray-400">
                    <thead id="ms-head" class="text-[10px] sm:text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-900 dark:text-gray-300">
                        <!-- JS Injected Headers -->
                    </thead>
                    <tbody id="ms-body">
                        <!-- JS Injected Rows -->
                    </tbody>
                </table>
            </form>
        </div>
    </div>
</div>

<!-- OCR Scan Modal -->
<div id="ocrUploadModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-modal md:h-full bg-black/50 backdrop-blur-sm">
    <div class="relative p-4 w-full max-w-2xl h-full md:h-auto">
        <div class="relative bg-white rounded-xl shadow-2xl dark:bg-gray-800">
            <!-- Modal header -->
            <div class="flex justify-between items-start p-4 rounded-t border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white flex items-center">
                    <i class="fas fa-camera-retro mr-3 text-primary-600"></i> Smart Scan & Autofill
                </h3>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-toggle="ocrUploadModal">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>  
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-6">
                <!-- Dropzone -->
                <div id="ocr-dropzone" class="flex justify-center items-center w-full mb-4">
                    <label for="ocr-file-upload" class="flex flex-col justify-center items-center w-full h-48 bg-gray-50 rounded-lg border-2 border-dashed border-primary-300 cursor-pointer dark:bg-gray-700 dark:border-gray-500 hover:bg-primary-50 dark:hover:bg-gray-600 transition-colors">
                        <div class="flex flex-col justify-center items-center pt-5 pb-6">
                            <i class="fas fa-cloud-upload-alt text-4xl text-primary-400 mb-3"></i>
                            <p class="mb-2 text-sm text-gray-500 dark:text-gray-400"><span class="font-bold">Click to upload</span> or drag and drop</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Scan of the Multi-Score Template (JPG, PNG)</p>
                        </div>
                        <input id="ocr-file-upload" type="file" class="hidden" accept="image/*" onchange="window.handleOcrFileUpload(event)" />
                    </label>
                </div>
                
                <!-- Preview & Progress Area (Hidden initially) -->
                <div id="ocr-progress-area" class="hidden w-full flex-col items-center">
                    <div class="w-full relative rounded-lg overflow-hidden border border-gray-200 shadow-sm bg-gray-100 flex justify-center p-2 mb-4 h-64 object-contain">
                        <img id="ocr-preview-img" class="max-h-full opacity-50" />
                        <div class="absolute inset-0 bg-primary-900/10 flex items-center justify-center">
                            <div class="text-center">
                                <i class="fas fa-cog fa-spin text-4xl text-primary-600 mb-2"></i>
                                <h4 id="ocr-status-text" class="text-lg font-bold text-gray-900">Scanning Document...</h4>
                                <p id="ocr-substatus-text" class="text-sm text-gray-600 mt-1">Detecting Context QR Code...</p>
                            </div>
                        </div>
                        <!-- Scanning laser animation -->
                        <div class="absolute top-0 w-full h-1 bg-green-400 shadow-[0_0_8px_2px_rgba(74,222,128,0.8)] animate-[scan_2s_ease-in-out_infinite]"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Hidden Canvas for Image Processing -->
<canvas id="ocr-canvas" class="hidden"></canvas>

<!-- Hidden Print Template for Generating the Blank Sheet -->
<div id="print-template-container" class="hidden !fixed top-[-9999px] left-0 bg-white">
    <div id="print-sheet-content" style="width: 210mm; background: white; font-family: sans-serif; color: black; box-sizing: border-box;">
        <!-- Dynamically filled with paginated pages in js -->
    </div>
</div>

<style>
@keyframes scan {
    0% { top: 0; }
    50% { top: 100%; }
    100% { top: 0; }
}
</style>

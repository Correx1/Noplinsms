<!-- Score Sheets (Single Assessment Entry) -->
<div class="p-4 sm:p-6 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 sm:gap-0 border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
    <div class="w-full mb-1">
        <nav class="flex mb-5" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
                <li class="inline-flex items-center">
                    <a href="#" onclick="loadDashboardHome()" class="inline-flex items-center text-gray-700 hover:text-primary-600 dark:text-gray-300 dark:hover:text-white">Home</a>
                </li>
                <li>
                    <div class="flex items-center">
                        <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                        <span class="ml-1 text-gray-400 md:ml-2 dark:text-gray-500">Grading & Promotion</span>
                    </div>
                </li>
            </ol>
        </nav>
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Score Sheets (Single Entry)</h1>
    </div>
</div>

<div class="p-2 sm:p-4">
    <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow mb-6">
        <p class="text-sm text-gray-500 mb-4">Select an Assessment to load the single-entry sheet for a specific class and subject.</p>
        <form id="load-sheet-form" class="grid grid-cols-1 md:grid-cols-4 gap-4" onsubmit="event.preventDefault(); window.loadSingleSheet();">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="sheet-class">Class</label>
                <select id="sheet-class" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    <!-- Injected via JS -->
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="sheet-subject">Subject</label>
                <select id="sheet-subject" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    <!-- Injected via JS -->
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="sheet-assessment">Assessment</label>
                <select id="sheet-assessment" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
                    <!-- Injected via JS from assessmentsData -->
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800 shadow-sm flex items-center justify-center">
                    <i class="fas fa-search mr-2"></i> Load Class List
                </button>
            </div>
        </form>
    </div>

    <!-- Generated Table -->
    <div id="sheet-table-container" class="hidden bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden relative">
        <!-- Header Ribbon -->
        <div class="bg-primary-50 dark:bg-primary-900/40 p-4 border-b border-primary-100 dark:border-primary-800 flex justify-between items-center flex-wrap gap-2">
            <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white" id="sheet-title-display">Mathematics - JSS 1</h3>
                <p class="text-xs text-primary-600 dark:text-primary-400 font-semibold uppercase tracking-wide" id="sheet-asm-display">First Term CA 1 (Max Score: 20)</p>
            </div>
            <button type="button" onclick="window.saveMarks()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm transition-colors flex items-center">
                <i class="fas fa-save mr-2"></i> Save All Marks
            </button>
        </div>

        <div class="overflow-x-auto">
            <form id="marks-form" onsubmit="event.preventDefault()">
                <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                        <tr>
                            <th scope="col" class="px-6 py-3 w-16">S/N</th>
                            <th scope="col" class="px-6 py-3 min-w-[200px] sticky left-0 bg-gray-50 dark:bg-gray-700 z-10 w-full sm:w-auto">Student Name</th>
                            <th scope="col" class="px-6 py-3 w-32">Admission No</th>
                            <th scope="col" class="px-6 py-3 w-40" id="sheet-score-col">Score ( /20)</th>
                            <th scope="col" class="px-6 py-3 w-16 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="sheet-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </form>
        </div>
    </div>
</div>

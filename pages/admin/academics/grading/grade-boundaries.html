<!-- Grade Boundaries -->
<div class="p-4 sm:p-6 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 sm:gap-0 border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
    <div class="w-full mb-1">
        <nav class="flex mb-5" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1 text-sm font-medium md:space-x-2">
                <li class="inline-flex items-center">
                    <a href="#" onclick="loadDashboardHome()" class="inline-flex items-center text-gray-700 hover:text-primary-600 dark:text-gray-300 dark:hover:text-white">Home</a>
                </li>
                <li>
                    <div class="flex items-center">
                        <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                        <span class="ml-1 text-gray-400 md:ml-2 dark:text-gray-500">Grading & Promotion</span>
                    </div>
                </li>
            </ol>
        </nav>
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Grade Boundaries</h1>
    </div>
</div>

<div class="p-4">
    <div class="w-full bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
        <div class="flex justify-between w-full mb-4">
            <h2 class="text-lg font-bold">Standard Grade System</h2>
            <button onclick="window.openBoundaryModal()" class="bg-primary-600 hover:bg-primary-700 text-white px-3 py-1.5 rounded-lg text-sm">+ Add Boundary</button>
        </div>
        <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400 border border-gray-200 dark:border-gray-700 rounded-lg">
            <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                <tr>
                    <th scope="col" class="px-6 py-3">Grade</th>
                    <th scope="col" class="px-6 py-3">Min Mark (%)</th>
                    <th scope="col" class="px-6 py-3">Max Mark (%)</th>
                    <th scope="col" class="px-6 py-3">Remark</th>
                    <th scope="col" class="px-6 py-3 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="boundaries-table-body">
                <!-- Javascript Injection -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Boundary Modal -->
<div id="boundary-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">

        <!-- Modal Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700 sticky top-0 bg-white dark:bg-gray-800 z-10 rounded-t-2xl">
            <h2 id="boundary-modal-title" class="text-lg font-bold text-gray-900 dark:text-white">Add Grade Boundary</h2>
            <button onclick="window.closeBoundaryModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" aria-label="Close">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>

        <!-- Modal Body -->
        <form id="boundary-form" onsubmit="event.preventDefault(); window.saveBoundary();" class="p-6 space-y-4">
            <input type="hidden" id="boundary-id">

            <div>
                <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Grade (e.g., A1, B2) <span class="text-red-500">*</span></label>
                <input type="text" id="boundary-grade" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5 focus:ring-primary-500 focus:border-primary-500" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Min Mark (%) <span class="text-red-500">*</span></label>
                    <input type="number" id="boundary-min" min="0" max="100" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5" required>
                </div>
                <div>
                    <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Max Mark (%) <span class="text-red-500">*</span></label>
                    <input type="number" id="boundary-max" min="0" max="100" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5" required>
                </div>
            </div>

            <div>
                <label class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-gray-300">Remark (e.g., Excellent) <span class="text-red-500">*</span></label>
                <input type="text" id="boundary-remark" class="w-full text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 dark:text-white p-2.5 focus:ring-primary-500 focus:border-primary-500" required>
            </div>

            <!-- Footer Buttons -->
            <div class="flex items-center gap-3 pt-2 border-t mt-4 border-gray-200 dark:border-gray-700">
                <button type="submit" class="flex-1 mt-4 py-2.5 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-lg transition-colors">
                    <i class="fas fa-check mr-2"></i>Save Boundary
                </button>
            </div>
        </form>
    </div>
</div>

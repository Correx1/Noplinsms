<!-- Result Sheets / Broadsheet -->
<div class="print:hidden">
    <!-- Header -->
    <div class="p-4 sm:p-6 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 sm:gap-0 border-b border-gray-200 lg:mt-1.5 dark:bg-gray-800 dark:border-gray-700">
        <div class="w-full mb-1">
            <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl dark:text-white">Result & Broadsheet Generation</h1>
        </div>
    </div>

    <!-- Filters -->
    <div class="p-4 sm:p-6">
        <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
            <form class="grid grid-cols-1 md:grid-cols-5 gap-4" onsubmit="event.preventDefault(); window.loadBroadsheet();">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Class</label>
                    <select id="rs-class" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" required>
                        <!-- JS populated -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Section</label>
                    <select id="rs-section" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                        <option value="All Sections">All Sections</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Session</label>
                    <select id="rs-session" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                        <!-- JS Populated ideally from settings or static list -->
                        <option value="2023/2024">2023/2024</option>
                        <option value="2024/2025" selected>2024/2025</option>
                        <option value="2025/2026">2025/2026</option>
                        <option value="2026/2027">2026/2027</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Term</label>
                    <select id="rs-term" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                        <option value="First Term">First Term</option>
                        <option value="Second Term">Second Term</option>
                        <option value="Third Term">Third Term</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button type="submit" class="w-full text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors dark:bg-primary-600 dark:hover:bg-primary-700 flex justify-center items-center shadow-sm">
                        <i class="fas fa-search mr-2"></i> Compute
                    </button>
                </div>
            </form>
        </div>

        <!-- Master Broadsheet UI (Hidden initially) -->
        <div id="rs-broadsheet-container" class="hidden">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                <!-- Ribbon -->
                <div class="bg-gray-50 dark:bg-gray-700/50 p-4 border-b border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900 dark:text-white" id="rs-title">Broadsheet Summary</h2>
                        <p class="text-sm text-gray-500 dark:text-gray-400" id="rs-subtitle">Computed 10 Records</p>
                    </div>
                    <button type="button" onclick="window.printAllReports()" class="text-white bg-indigo-600 hover:bg-indigo-700 font-semibold rounded-lg text-sm px-5 py-2.5 transition-colors shadow-sm flex items-center">
                        <i class="fas fa-print mr-2"></i> Print All Report Cards (PDF)
                    </button>
                </div>

                <!-- Aggregate Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-gray-700 dark:text-gray-400">
                            <tr>
                                <th scope="col" class="px-6 py-3">Student Name</th>
                                <th scope="col" class="px-6 py-3">Class Position</th>
                                <th scope="col" class="px-6 py-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="rs-tbody">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- PREVIEW MODAL -->
    <div id="rs-preview-modal" tabindex="-1" class="hidden fixed inset-0 z-[100] w-full h-full overflow-y-auto bg-gray-900/95 backdrop-blur-sm flex-col items-center">
        <!-- Floating Header -->
        <div class="w-full max-w-5xl flex justify-between items-center p-4 md:p-6 sticky top-0 z-10 transition-all">
            <h3 class="text-white font-bold text-sm md:text-xl drop-shadow-md truncate max-w-[50%]" id="rs-preview-title">
                Report Card Preview
            </h3>
            <div class="flex items-center gap-2 md:gap-4 shrink-0">
                <button type="button" onclick="window.printSinglePDF()" class="text-gray-900 bg-white hover:bg-gray-100 font-bold rounded-full text-xs md:text-sm px-4 md:px-6 py-2 shadow-xl flex items-center transition-transform active:scale-95">
                    <i class="fas fa-print mr-2"></i> <span class="hidden md:inline">Print Result</span><span class="md:hidden">Print</span>
                </button>
                <button type="button" onclick="closePreviewModal()" class="text-white bg-red-500 hover:bg-red-600 rounded-full w-8 h-8 md:w-10 md:h-10 flex justify-center items-center shadow-xl transition-transform active:scale-95">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <!-- Scaled A4 Container -->
        <div class="w-full flex-1 flex justify-center items-start pt-2 pb-20 overflow-x-hidden">
            <div id="rs-preview-body" class="bg-white shadow-2xl origin-top transition-transform duration-300" style="width: 210mm; min-height: 297mm;">
                <!-- Dynamic Print HTML Injected Here -->
            </div>
        </div>
    </div>


    <!-- DOMAINS & REMARKS MODAL -->
    <div id="domains-eval-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full bg-gray-900/50 backdrop-blur-sm">
        <div class="relative p-4 w-full max-w-2xl max-h-full mx-auto md:mt-10">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white flex items-center">
                        <i class="fas fa-clipboard-check text-primary-600 mr-2"></i>
                        Evaluate Domains & Remark
                    </h3>
                    <button type="button" onclick="closeDomainsModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <!-- Modal body -->
                <div class="p-4 md:p-5 space-y-4">
                    <h4 class="font-bold text-lg text-gray-800 dark:text-white" id="domains-student-name">Student Name</h4>
                    <p class="text-sm text-gray-500 mb-6">Grade domains from 1 to 5 (5 = Excellent, 1 = Poor)</p>
                    
                    <form id="domainsEvalForm">
                        <input type="hidden" id="evalTargetStudentId">
                        
                        <!-- Dynamic Domain Inputs injected here natively mapped from global settings -->
                        <div class="grid grid-cols-2 gap-4 mb-6" id="domains-inputs-container">
                            <!-- JS Inject -->
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Teacher's Remark</label>
                            <textarea id="evalTeacherRemark" rows="3" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white" placeholder="Write a short evaluation remark..."></textarea>
                        </div>
                    </form>
                </div>
                <!-- Modal footer -->
                <div class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600 justify-end">
                    <button type="button" onclick="closeDomainsModal()" class="py-2.5 px-5 ms-3 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-primary-700 focus:z-10 focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:text-white dark:hover:bg-gray-700">Cancel</button>
                    <button type="button" onclick="saveDomainEvaluations()" class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 ml-3">Save Evaluation</button>
                </div>
            </div>
        </div>
    </div>

<!-- PRINT CONTAINER: Only visible during Window.print() / Ctrl+P -->
<div id="print-container" class="hidden print:block w-full bg-white print:bg-white text-black p-0 m-0 print:absolute print:top-0 print:left-0 print:z-[9999]">

</div>

<!-- Internal CSS forcing exact PDF print layouts without browser margins ruining it -->
<style>
@media print {
    @page { margin: 0; size: A4 portrait; }
    
    /* Annihilate all site layouts violently to secure blank canvas wrapper */
    body { background-color: white !important; margin: 0 !important; padding: 0 !important; }
    aside, nav, header, footer, .sidebar, #sidebar-container, #navbar-container { display: none !important; }
    .print\:hidden { display: none !important; }
    
    /* Format the print container completely dominant */
    #print-container {
        display: block !important;
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100% !important;
        margin: 0 !important; padding: 0 !important;
        background: white !important;
        z-index: 99999 !important;
    }
    
    .print-page-break {
        page-break-after: always;
        break-after: page;
        width: 100%;
        box-sizing: border-box;
        overflow: hidden;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    .print-page-break:last-child {
        page-break-after: auto;
        break-after: auto;
    }
}
</style>

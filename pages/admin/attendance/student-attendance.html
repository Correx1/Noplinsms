<div class="p-4 sm:p-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Student Attendance</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Date: <span id="current-date-display" class="font-medium text-gray-900 dark:text-white"></span></p>
        </div>
        <div class="mt-4 md:mt-0 flex flex-wrap gap-2">
            <button id="student-nfc-btn" onclick="startAttendanceNFC()"
                class="hidden items-center gap-2 text-primary-700 bg-primary-100 border border-primary-300 focus:outline-none hover:bg-primary-200 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
                <i class="fas fa-wifi mr-2"></i> Scan Card
            </button>
            <button onclick="window.history.back()"
                class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700">
                Cancel
            </button>
            <button onclick="saveAttendance()"
                class="text-white bg-primary-600 hover:bg-primary-700 font-medium rounded-lg text-sm px-5 py-2.5">
                <i class="fas fa-save mr-2"></i> Save
            </button>
        </div>
    </div>

    <!-- Last Scan Banner -->
    <div id="student-scan-banner" class="hidden mb-4"></div>

    <!-- Selection Card -->
    <div class="p-4 mb-6 bg-white border border-gray-200 rounded-2xl shadow-sm dark:bg-gray-800 dark:border-gray-700">
        <h3 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">Attendance Details</h3>
        <form id="attendance-filter-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label for="attendance-date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Date</label>
                <input type="date" id="attendance-date"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
            </div>
            <div>
                <label for="class-select" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Class</label>
                <select id="class-select"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <option value="">Select Class</option>
                    <option value="JSS1">JSS1</option><option value="JSS2">JSS2</option><option value="JSS3">JSS3</option>
                    <option value="SS1">SS1</option><option value="SS2">SS2</option><option value="SS3">SS3</option>
                </select>
            </div>
            <div>
                <label for="section-select" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Section</label>
                <select id="section-select"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <option value="A">Section A</option><option value="B">Section B</option><option value="C">Section C</option>
                </select>
            </div>
            <div>
                <button type="submit"
                    class="w-full text-white bg-primary-700 hover:bg-primary-800 font-medium rounded-lg text-sm px-5 py-2.5">
                    Load List
                </button>
            </div>
        </form>
    </div>

    <!-- Attendance Table -->
    <div id="attendance-container" class="hidden">

        <!-- Selection info bar -->
        <div id="student-selection-bar" class="hidden mb-3 px-4 py-2.5 bg-primary-50 dark:bg-primary-900/20 border border-primary-200 dark:border-primary-800 rounded-xl flex items-center gap-3">
            <span class="text-sm font-semibold text-primary-700 dark:text-primary-300">
                <span id="student-selected-count">0</span> row(s) selected
            </span>
            <span class="text-gray-300">|</span>
            <button onclick="window.selectAllStudents(true)" class="text-xs text-primary-600 hover:underline">Select All</button>
            <button onclick="window.selectAllStudents(false)" class="text-xs text-gray-500 hover:underline">Deselect All</button>
        </div>

        <!-- Quick Actions (work on selected rows) -->
        <div class="flex flex-wrap gap-2 mb-4">
            <button onclick="window.setAsStudentClockIn()"
                class="px-3 py-2 text-xs font-bold text-green-700 bg-green-100 rounded-lg hover:bg-green-200 dark:bg-green-900/30 dark:text-green-300" title="Starts scanner, forces Clock-In direction">
                <i class="fas fa-sign-in-alt mr-1"></i> Set As Clock-In Now
            </button>
            <button onclick="window.setAsStudentClockOut()"
                class="px-3 py-2 text-xs font-bold text-blue-700 bg-blue-100 rounded-lg hover:bg-blue-200 dark:bg-blue-900/30 dark:text-blue-300" title="Starts scanner, forces Clock-Out direction">
                <i class="fas fa-sign-out-alt mr-1"></i> Set As Clock-Out Now
            </button>
            <button onclick="window.markStudentAs('Absent')"
                class="px-3 py-2 text-xs font-bold text-red-700 bg-red-100 rounded-lg hover:bg-red-200 dark:bg-red-900/30 dark:text-red-300" title="Mark selected rows as Absent (no scan required)">
                <i class="fas fa-times-circle mr-1"></i> Mark As Absent
            </button>
            <button onclick="window.markStudentAs('Leave')"
                class="px-3 py-2 text-xs font-bold text-purple-700 bg-purple-100 rounded-lg hover:bg-purple-200 dark:bg-purple-900/30 dark:text-purple-300" title="Mark selected rows as Leave (no scan required)">
                <i class="fas fa-umbrella-beach mr-1"></i> Mark As Leave
            </button>
            <button onclick="window.resetTodayAttendance()"
                class="px-3 py-2 text-xs font-bold text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-400" title="Clear all attendance data for the selected date">
                <i class="fas fa-trash-alt mr-1"></i> Reset Day
            </button>
        </div>

        <!-- No-selection notice -->
        <div id="student-no-selection-notice" class="hidden mb-3 px-4 py-2 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl text-sm text-amber-700 dark:text-amber-300">
            <i class="fas fa-exclamation-circle mr-1"></i> Please select at least one row to perform this action.
        </div>

        <div class="relative overflow-x-auto shadow-md sm:rounded-2xl">
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th class="px-4 py-3 w-10">
                            <input type="checkbox" id="select-all-students" class="w-4 h-4 text-primary-600 rounded cursor-pointer"
                                onchange="window.selectAllStudents(this.checked)">
                        </th>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Photo</th>
                        <th class="px-4 py-3">Name</th>
                        <th class="px-4 py-3 text-center text-green-600">
                            <i class="fas fa-sign-in-alt mr-1"></i> Clock-In
                        </th>
                        <th class="px-4 py-3 text-center text-blue-600">
                            <i class="fas fa-sign-out-alt mr-1"></i> Clock-Out
                        </th>
                        <th class="px-4 py-3 text-center">Status</th>
                        <th class="px-4 py-3">Remarks</th>
                    </tr>
                </thead>
                <tbody id="attendance-table-body">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>

        <div class="flex flex-wrap justify-end gap-3 mt-6">
            <button onclick="saveAttendance()"
                class="text-white bg-primary-600 hover:bg-primary-700 font-medium rounded-lg text-sm px-5 py-2.5">
                <i class="fas fa-save mr-2"></i> Save Attendance
            </button>
            <button onclick="saveAttendance(true)"
                class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-gray-800 dark:text-white dark:border-gray-600">
                <i class="fas fa-print mr-2"></i> Save & Print
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast-attendance" class="hidden fixed top-5 right-5 z-50 flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-2xl shadow-xl dark:text-gray-400 dark:bg-gray-800 border border-gray-200 dark:border-gray-700" role="alert">
    <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-green-500 bg-green-100 rounded-xl"><i class="fas fa-check"></i></div>
    <div class="ml-3 text-sm font-normal">Attendance saved successfully!</div>
</div>

<div class="p-4 sm:p-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Reports & Analytics</h1>
            <nav class="flex mt-1" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-3">
                    <li class="inline-flex items-center">
                        <a href="#" onclick="loadDashboardHome()" class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-primary-600 dark:text-gray-400 dark:hover:text-white">
                            <i class="fas fa-home mr-2"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <i class="fas fa-chevron-right text-gray-400 mx-1"></i>

                        </div>

    <!-- 12-Grid Category Cards -->

        <!-- 1. Students -->
        <div onclick="selectReportCategory('student')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-blue-600 active-report hover:bg-gray-50">

                <i class="fas fa-user-graduate text-2xl text-primary-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Students</h3>
            </div>
        </div>
         <!-- 2. Teachers -->
        <div onclick="selectReportCategory('teacher')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-chalkboard-teacher text-2xl text-purple-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Teachers</h3>
            </div>
        </div>
        <!-- 3. Parents -->
        <div onclick="selectReportCategory('parent')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-users text-2xl text-indigo-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Parents</h3>
            </div>
        </div>
         <!-- 4. Finance -->
        <div onclick="selectReportCategory('finance')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-coins text-2xl text-green-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Finance</h3>
            </div>
        </div>
         <!-- 5. Attendance -->
        <div onclick="selectReportCategory('attendance')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-clock text-2xl text-red-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Attendance</h3>
            </div>
        </div>
         <!-- 6. Academic -->
        <div onclick="selectReportCategory('academic')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-graduation-cap text-2xl text-yellow-500 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Academic</h3>
            </div>
        </div>
         <!-- 7. Library -->
        <div onclick="selectReportCategory('library')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-book text-2xl text-teal-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Library</h3>
            </div>
        </div>
         <!-- 8. Transport -->
        <div onclick="selectReportCategory('transport')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-bus text-2xl text-orange-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Transport</h3>
            </div>
        </div>
         <!-- 9. Hostel -->
        <div onclick="selectReportCategory('hostel')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-building text-2xl text-pink-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Hostel</h3>
            </div>
        </div>
         <!-- 10. Events -->
        <div onclick="selectReportCategory('events')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-calendar-alt text-2xl text-cyan-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Events</h3>
            </div>
        </div>
         <!-- 11. Visitors -->
        <div onclick="selectReportCategory('visitors')" class="report-card cursor-pointer p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md dark:bg-gray-800 dark:border-gray-700 border-l-4 border-l-transparent hover:bg-gray-50">
            <div class="text-center">
                <i class="fas fa-id-card-alt text-2xl text-gray-600 mb-2"></i>
                <h3 class="text-xs font-bold text-gray-900 dark:text-white">Visitors</h3>
            </div>
        </div>
    </div>

    <!-- Filters Section based on selection -->
    <div class="p-4 mb-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">
        <h3 class="mb-4 text-sm font-bold text-gray-700 dark:text-gray-300 uppercase" id="current-report-title">Report Configuration</h3>
        <form id="report-filter-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <!-- Dynamic Filters -->
            <div class="md:col-span-1">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Report Type</label>
                <select id="report-type-select" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <!-- JS Populated -->
                </select>
            </div>
             <div class="md:col-span-1">
                <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Date Range</label>
                <select class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <option>Last 30 Days</option>
                    <option>This Month</option>
                    <option>Last Month</option>
                    <option>This Term</option>
                    <option>This Year</option>
                </select>
            </div>
            
            <div class="md:col-span-1 md:ml-auto">
                <button type="button" onclick="generateReport()" class="w-full text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800">
                    Generate Report
                </button>
            </div>
        </form>
    </div>

    <!-- Report Result -->
    <div id="report-result-area" class="space-y-6">
        <div class="p-10 text-center text-gray-500 bg-white border border-gray-200 rounded-lg dark:bg-gray-800 dark:border-gray-700">
            <i class="fas fa-file-alt text-4xl mb-4 text-gray-300"></i>
            <p>Select parameters and click "Generate Report" to view analytics.</p>
        </div>
    </div>

</div>

<!-- Logic handled by js/reports.js (loaded externally by sidebar.js) -->
<script>
    function selectReportCategory(cat) {
        // Highlight logic
        document.querySelectorAll('.report-card').forEach(c => {
            c.classList.remove('border-l-blue-600', 'active-report');
            c.classList.add('border-l-transparent');
        });
        event.currentTarget.classList.remove('border-l-transparent');
        event.currentTarget.classList.add('border-l-blue-600', 'active-report');
        
        const title = document.getElementById('current-report-title');
        const select = document.getElementById('report-type-select');
        title.textContent = cat.charAt(0).toUpperCase() + cat.slice(1) + ' Reports';
        
        // Populate Dropdown based on Cat
        let opts = [];
        if(cat==='student') opts = ['Class Strength', 'Gender Ratio', 'New Admissions', 'Student History'];
        if(cat==='teacher') opts = ['Teacher Workload', 'Subject Allocation', 'Teacher Attendance'];
        if(cat==='parent') opts = ['PTA Meeting Logs', 'Parent Contact List'];
        if(cat==='finance') opts = ['Income Statement', 'Expense Report', 'Fee Collection', 'Defaulters List', 'Profit/Loss'];
        if(cat==='attendance') opts = ['Student Daily Attendance', 'Student Monthly Report', 'Staff Attendance', 'Late Comers'];
        if(cat==='academic') opts = ['Term Results', 'Subject Performance', 'Toppers List', 'Failure Rate'];
        if(cat==='library') opts = ['Books Inventory', 'Issued Books', 'Overdue Reports', 'Fine Collection'];
        if(cat==='transport') opts = ['Route Wise Students', 'Vehicle Utilization', 'Driver Schedule', 'Transport Fees'];
        if(cat==='hostel') opts = ['Room Occupancy', 'Mess Info', 'Hostel Fee Collection'];
        if(cat==='events') opts = ['Event Participation', 'Event Budget Report'];
        if(cat==='visitors') opts = ['Visitor Logs', 'Gate Pass Report'];

        select.innerHTML = opts.map(o => `<option>${o}</option>`).join('');
    }

    function generateReport() {
        const cat = document.querySelector('.report-card.active-report')?.dataset?.cat || 'student';
        const type = document.getElementById('report-type-select').value;
        const area = document.getElementById('report-result-area');

        // Build mock data rows from localStorage
        let headers = [];
        let rows = [];

        if (cat === 'student') {
            const students = JSON.parse(localStorage.getItem('studentsData') || '[]');
            headers = ['ID', 'Name', 'Class', 'Gender', 'Status', 'Date Added'];
            rows = students.length > 0
                ? students.map(s => [s.id || '', s.name || '', s.class || '', s.gender || '', 'Active', s.dob || ''])
                : [['STD001','Amaka Okonkwo','SSS2A','Female','Active','2008-04-15'],['STD002','Chukwu Emeka','JSS3B','Male','Active','2009-01-20'],['STD003','Fatima Bello','SSS1A','Female','Active','2007-09-03']];
        } else if (cat === 'finance') {
            headers = ['Ref No', 'Student / Staff', 'Description', 'Amount (₦)', 'Date', 'Status'];
            rows = [['INV001','Amaka Okonkwo','Tuition Fee – First Term','50000','2024-09-15','Paid'],['INV002','Emeka Chukwu','Tuition Fee – First Term','50000','2024-09-18','Paid'],['INV003','Fatima Bello','Development Levy','5000','2024-09-20','Outstanding']];
        } else if (cat === 'teacher' || cat === 'parent') {
            headers = ['ID', 'Name', 'Phone', 'Email', 'Assigned Class', 'Status'];
            rows = [['TCH001','Mr. Adebayo','08012345678','adebayo@school.com','SSS2A','Active'],['TCH002','Mrs. Ngozi','08098765432','ngozi@school.com','JSS3B','Active']];
        } else if (cat === 'attendance') {
            headers = ['Date', 'Class', 'Present', 'Absent', 'Total', '% Present'];
            rows = [['2024-10-01','SSS2A','40','5','45','88.9%'],['2024-10-02','SSS2A','42','3','45','93.3%'],['2024-10-03','JSS1A','35','5','40','87.5%']];
        } else if (cat === 'academic') {
            headers = ['Student ID', 'Name', 'Class', 'Average Score', 'Position', 'Status'];
            rows = [['STD001','Amaka Okonkwo','SSS2A','87.4%','1st','Promoted'],['STD002','Emeka Chukwu','SSS2A','79.2%','2nd','Promoted'],['STD003','Fatima Bello','SSS2A','52.1%','15th','Promoted']];
        } else {
            headers = ['ID', 'Name', 'Details', 'Date', 'Status'];
            rows = [['001','Sample Record','Details here','2024-10-01','Active'],['002','Sample Record 2','Details here','2024-10-02','Active']];
        }

        area.innerHTML = `
            <div class="p-4 sm:p-6 bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
                    <div>
                        <h3 class="font-bold text-gray-900 dark:text-white">${type || 'Report'}</h3>
                        <p class="text-sm text-gray-500">Generated: ${new Date().toLocaleString()}</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="_downloadCSV()" class="flex items-center gap-1.5 px-3 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 font-medium">
                            <i class="fas fa-file-excel"></i> Download Excel (CSV)
                        </button>
                        <button onclick="window.print()" class="flex items-center gap-1.5 px-3 py-2 bg-gray-600 text-white rounded-lg text-sm hover:bg-gray-700 font-medium">
                            <i class="fas fa-print"></i> Print
                        </button>
                    </div>
                </div>
                <div class="relative overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-sm text-left text-gray-600 dark:text-gray-400">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-300">
                            <tr>${headers.map(h=>`<th class="px-4 py-3">${h}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                            ${rows.map((r,i)=>`<tr class="${i%2?'bg-gray-50 dark:bg-gray-700/30':'bg-white dark:bg-gray-800'} border-b dark:border-gray-700">${r.map(c=>`<td class="px-4 py-3">${c}</td>`).join('')}</tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-400 mt-3">Showing ${rows.length} record(s) — CorrexSMS Report Engine</p>
            </div>`;

        // Store for CSV export
        window._reportHeaders = headers;
        window._reportRows = rows;
        window._reportTitle = type || 'Report';
    }

    window._downloadCSV = function() {
        if (!window._reportHeaders) return;
        const csvContent = [window._reportHeaders, ...window._reportRows]
            .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))
            .join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (window._reportTitle || 'report').replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0,10) + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    // Add data-cat attribute to every card so generateReport can read it
    document.querySelectorAll('.report-card').forEach(card => {
        const oc = card.getAttribute('onclick') || '';
        const m = oc.match(/selectReportCategory\('(\w+)'\)/);
        if (m) card.dataset.cat = m[1];
    });

    // Init with first selection
    selectReportCategory('student');

    // Also wire the generate button robustly
    document.getElementById('btn-generate-results') && 
        document.getElementById('btn-generate-results').addEventListener('click', generateReport);
    const genBtn = document.querySelector('[onclick="generateReport()"]');
    if (!genBtn) {
        // button uses onclick attr — already works. Nothing to do.
    }
</script>

<div class="p-4 sm:p-6 pb-20"> <!-- Added pb-20 to ensure scrolling doesn't cut off cards -->
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Staff Directory</h1>
            <nav class="flex mt-1" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-3">
                    <li class="inline-flex items-center">
                        <a href="#" onclick="loadDashboardHome()" class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-primary-600 dark:text-gray-400 dark:hover:text-white">
                            <i class="fas fa-home mr-2"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <i class="fas fa-chevron-right text-gray-400 mx-1"></i>
                            <span class="ml-1 text-sm font-medium text-gray-700 hover:text-primary-600 md:ml-2 dark:text-gray-400 dark:hover:text-white">Human Resources</span>
                        </div>
                    </li>
                    <li aria-current="page">
                        <div class="flex items-center">
                            <i class="fas fa-chevron-right text-gray-400 mx-1"></i>
                            <span class="ml-1 text-sm font-medium text-gray-500 md:ml-2 dark:text-gray-500">Staff Directory</span>
                        </div>
                    </li>
                </ol>
            </nav>
        </div>
        
        <div class="mt-4 md:mt-0">
             <button onclick="window.loadHRAddStaffPage()" class="flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-white rounded-lg bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 dark:bg-primary-600 dark:hover:bg-primary-700 focus:outline-none dark:focus:ring-primary-800 transition-colors shadow-sm">
                <i class="fas fa-user-plus"></i> Add New Staff
            </button>
        </div>
    </div>

    <!-- Main Card -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md border hover:border-primary-500 transition-colors dark:border-gray-700" id="directory-container">
        <!-- Header Actions -->
        <div class="p-4 sm:p-6 border-b border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-between gap-4">
            <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                <div class="relative w-full sm:w-64 border-r dark:border-gray-600 pr-0 sm:pr-4">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i class="fas fa-search text-gray-500 dark:text-gray-400"></i>
                    </div>
                    <input type="text" id="hr-search" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" placeholder="Search staff name or ID...">
                </div>
                
                <select id="staff-dept-filter" onchange="window.hrApp.filterData()" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full sm:w-48 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <option value="">All Departments</option>
                    <!-- Populated by JS -->
                </select>
                
                <select id="staff-role-filter" onchange="window.hrApp.filterData()" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full sm:w-48 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                    <option value="">All Designations</option>
                     <!-- Populated by JS -->
                </select>
            </div>
            
            <div class="flex items-center space-x-2">
                 <button id="view-grid" onclick="window.hrApp.toggleStaffView('grid')" class="p-2 text-primary-600 bg-primary-50 hover:bg-primary-100 rounded-lg dark:bg-gray-700 dark:text-primary-400 dark:hover:bg-gray-600 transition-colors" title="Grid View">
                     <i class="fas fa-th-large"></i>
                 </button>
                 <button id="view-list" onclick="window.hrApp.toggleStaffView('list')" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg dark:text-gray-400 dark:hover:bg-gray-600 transition-colors" title="List View">
                     <i class="fas fa-list"></i>
                 </button>
            </div>
        </div>

        <!-- Directory Content Area (Will be injected by JS) -->
        <div id="staff-container" class="p-4 sm:p-6 bg-gray-50 dark:bg-gray-900">
             <!-- Skeleton loaders will be here on init -->
        </div>
        
        <!-- Pagination -->
        <div id="hr-pagination" class="border-t border-gray-200 dark:border-gray-700 p-4 flex flex-col sm:flex-row items-center justify-between gap-4 hidden bg-white dark:bg-gray-800 rounded-b-lg">
             <!-- Rendered via JS -->
        </div>
    </div>
</div>

<!-- Staff Detail Modal -->
<div id="staffDetailModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
    <div class="relative p-4 w-full max-w-2xl max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow dark:bg-gray-800">
            <!-- Header (Cover Image style) -->
            <div class="h-24 bg-primary-600 rounded-t-lg flex justify-end p-4">
                 <button type="button" class="text-white/70 bg-transparent hover:text-white rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center" data-modal-hide="staffDetailModal" onclick="window.hrApp.closeModal()">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            
            <div class="px-6 pb-6 w-full text-center sm:text-left">
                <!-- Avatar overlapping header -->
                <div class="flex flex-col sm:flex-row sm:items-end -mt-12 sm:-mt-10 mb-4">
                    <img id="detail-avatar" class="w-24 h-24 mb-3 sm:mb-0 rounded-full border-4 border-white dark:border-gray-800 shadow-lg object-cover mx-auto sm:mx-0" src="" alt="Avatar">
                    <div class="sm:ml-4 flex-1">
                        <h3 class="text-2xl font-bold text-gray-900 dark:text-white" id="detail-name">Staff Name</h3>
                        <p class="text-sm font-medium text-primary-600 dark:text-primary-400 mt-1" id="detail-designation">Designation</p>
                    </div>
                    <div class="mt-4 sm:mt-0 flex gap-2 justify-center">
                         <button class="px-3 py-1.5 text-xs font-medium text-white bg-primary-600 rounded-lg shadow-sm hover:bg-primary-700"><i class="fas fa-edit mr-1"></i> Edit Profile</button>
                    </div>
                </div>

                <!-- Info Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <!-- Column 1 -->
                    <div class="space-y-4">
                        <div>
                            <h4 class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider mb-2 border-b border-gray-200 dark:border-gray-700 pb-1">Personal Info</h4>
                            <dl class="space-y-2 text-sm">
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">ID:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-id"></dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Gender:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-gender"></dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Phone:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-phone"></dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Email:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white truncate" id="detail-email" title=""></dd>
                                </div>
                            </dl>
                        </div>
                        
                        <div>
                            <h4 class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider mb-2 border-b border-gray-200 dark:border-gray-700 pb-1">Emergency Contact</h4>
                            <dl class="space-y-2 text-sm">
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Name:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-emerg-name"></dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Phone:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-emerg-phone"></dd>
                                </div>
                            </dl>
                        </div>
                    </div>

                    <!-- Column 2 -->
                    <div class="space-y-4">
                         <div>
                            <h4 class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider mb-2 border-b border-gray-200 dark:border-gray-700 pb-1">Employment Tracking</h4>
                            <dl class="space-y-2 text-sm">
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Dept:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-dept"></dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Joined:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-joined"></dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Status:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-status"></dd>
                                </div>
                            </dl>
                        </div>
                        
                        <div>
                            <h4 class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wider mb-2 border-b border-gray-200 dark:border-gray-700 pb-1">Bank Information</h4>
                            <dl class="space-y-2 text-sm">
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Bank:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white" id="detail-bank">First Bank PLC</dd>
                                </div>
                                <div class="flex">
                                    <dt class="w-1/3 text-gray-500 dark:text-gray-400">Acct:</dt>
                                    <dd class="w-2/3 font-medium text-gray-900 dark:text-white tracking-widest" id="detail-acct">30219***45</dd>
                                </div>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

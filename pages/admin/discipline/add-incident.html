<!-- Page Header -->
<div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="flex items-center gap-3">
        <button onclick="window.loadDisciplinePage()" class="p-2 text-gray-500 rounded-lg hover:bg-gray-100 hover:text-gray-900 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white transition-colors">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div>
            <h1 id="page-title" class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Record Incident</h1>
            <p id="page-subtitle" class="text-sm text-gray-600 dark:text-gray-400">Add a new disciplinary incident.</p>
        </div>
    </div>
</div>

<!-- Main Form Card -->
<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md border dark:border-gray-700 p-6 max-w-3xl">
    <form id="discipline-form">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            
            <!-- Student Selection -->
            <div class="col-span-1 md:col-span-2">
                <label for="incident-student" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Student <span class="text-red-500">*</span></label>
                <div class="flex">
                    <input type="text" id="incident-student" class="rounded-none rounded-l-lg bg-gray-50 border border-gray-300 text-gray-900 text-sm focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" placeholder="e.g. STU001 (Adebayo Ogunlesi)" required>
                    <button type="button" id="discipline-nfc-btn" onclick="startDisciplineNFC()" class="hidden items-center justify-center px-4 bg-primary-100 hover:bg-primary-200 text-primary-700 border border-l-0 border-primary-200 rounded-r-lg transition-colors shrink-0" title="Scan ID & Fingerprint">
                        <i class="fas fa-wifi mr-1"></i> Scan
                    </button>
                </div>
            </div>

            <!-- Date -->
            <div>
                <label for="incident-date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Date of Incident <span class="text-red-500">*</span></label>
                <input type="date" id="incident-date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" required>
            </div>

            <!-- Category -->
            <div>
                <label for="incident-category" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Category <span class="text-red-500">*</span></label>
                <select id="incident-category" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" required>
                    <option value="">Select Category</option>
                    <option value="Lateness">Lateness</option>
                    <option value="Disruption">Disruption</option>
                    <option value="Property Damage">Property Damage</option>
                    <option value="Bullying">Bullying</option>
                    <option value="Uniform Violation">Uniform Violation</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Description -->
            <div class="col-span-1 md:col-span-2">
                <label for="incident-desc" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Description of Incident <span class="text-red-500">*</span></label>
                <textarea id="incident-desc" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" placeholder="Detail what happened during the incident..." required></textarea>
            </div>

            <!-- Action Taken -->
            <div class="col-span-1 md:col-span-2">
                <label for="incident-action" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Action Taken</label>
                <textarea id="incident-action" rows="2" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors" placeholder="E.g., Warning issued, Parent summoned, 1-day suspension"></textarea>
            </div>
            
            <!-- Status -->
            <div>
                <label for="incident-status" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Status</label>
                <select id="incident-status" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition-colors">
                    <option value="Pending">Pending</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-4 mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
            <button type="button" onclick="window.loadDisciplinePage()" class="text-gray-700 bg-white border border-gray-300 font-medium rounded-lg text-sm px-5 py-2.5 hover:bg-gray-50 focus:ring-4 focus:outline-none focus:ring-gray-200 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:border-gray-500 dark:focus:ring-gray-700 transition-colors">
                Cancel
            </button>
            <button type="submit" class="text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 transition-colors">
                Save Record
            </button>
        </div>
</div>
